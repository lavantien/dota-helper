# engine/cmd is process-level wiring over live crawls (no test binary, also
# outside -coverpkg in the Makefile engine-cover target); everything under
# engine/internal plus the picker scoring core is the measured surface
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 0.2%
    patch: off

ignore:
  - "engine/cmd"

comment:
  layout: "reach, diff, files"
